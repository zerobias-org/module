openapi: 3.0.3
info:
  version: "0.0.0"
  description: "OCSF Receiver: OCSF event files dropped on a volume, served through the OCSF interface"
  title: '@zerobias-org/module-ocsf-v1'
  x-impl-name: ocsf
  x-product-infos:
    - $ref: './node_modules/@zerobias-org/product-auditmation-generic-dataproducer/catalog.yml#/Product'
    - $ref: './node_modules/@zerobias-org/product-zerobias-zerobias/catalog.yml#/Product'
# Two interfaces, both referenced path by path from their modules; the implementation is Java (java/).
#  - @zerobias-org/module-interface-ocsf: EVERY path (listClasses, list<Class>/get<Class> per class).
#    A class with no events answers an empty page / 404. ApiSpecTest fails when an interface
#    upgrade adds or drops a path here: refresh this list from the interface's dist yml.
#  - @zerobias-org/module-interface-dataproducer: only the files side (DESIGN §3): browse /inbox,
#    /files, /stats; documents; download; and upload/mkdir/delete under /inbox, which are refused
#    unless the deployment sets config.allowFileManagement=true (isSupported reports it). Events
#    are not DataProducer objects, so collections, functions and schemas are not referenced.
