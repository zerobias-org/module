  # ---- Connection lifecycle (required for Docker-based modules) ----
  /connect:
    post:
      tags: [connection]
      summary: Establish a receiver session
      description: >-
        Binds a producer session for the given connection. The profile is
        informational and is not validated — there are no credentials: the inbox
        poller and buffer are daemon-owned, configured by runtimeConfig, and already
        running; connect is the DataProducer handshake the pipeline uses before
        browse/drain.
      operationId: connect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionProfile'
      responses:
        '200':
          description: Connected
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: connected
        '400':
          description: Malformed request (no connection id, body not a JSON object)
          content:
            application/json:
              schema:
                $ref: './node_modules/@zerobias-org/module-interface-dataproducer/dist/module-interface-dataproducer.yml#/components/schemas/illegalArgumentError'
        '500':
          description: Unexpected failure; the cause is logged by the module, never returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcsfUnexpectedError'
  /disconnect:
    post:
      tags: [connection]
      summary: Close the receiver session
      description: >-
        Releases the producer session. Does NOT stop the inbox poller or flush
        the buffer — those are daemon-owned and survive disconnect.
      operationId: disconnect
      responses:
        '200':
          description: Disconnected
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: disconnected
  /metadata:
    get:
      tags: [connection]
      summary: Connection metadata and health
      operationId: getConnectionMetadata
      responses:
        '200':
          description: Connection metadata
          content:
            application/json:
              schema:
                type: object
                required: [status, eventCount]
                properties:
                  status:
                    type: string
                    enum: [On, Error]
                    description: On while /healthz is healthy, Error while it is degraded
                  eventCount:
                    type: integer
                    format: int64
                    description: OCSF events held in the buffer
  /healthz:
    get:
      tags: [health]
      summary: Daemon health probe
      description: >-
        Liveness/health for the always-on daemon. Hub Node polls this every 30s
        for daemon-mode deployments (DESIGN §9). Returns poller state per source,
        the event count, and database file sizes. 503 when the poller is down, under
        backpressure, or any source is unwritable, failing its scans or stalled.
      operationId: getHealth
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
components:
  schemas:
    ConnectionProfile:
      $ref: './connectionProfile.yml'
    OcsfUnexpectedError:
      description: >-
        The platform unexpectedError body — errorModelBase plus a msg that is always
        the same generic text (the cause can name paths inside the container).
      allOf:
        - $ref: './node_modules/@zerobias-org/module-interface-dataproducer/dist/module-interface-dataproducer.yml#/components/schemas/errorModelBase'
        - type: object
          required: [msg]
          properties:
            msg:
              type: string
    HealthStatus:
      type: object
      required: [poller, db]
      properties:
        poller:
          type: object
          required: [up, eventCount, backpressure, sources]
          properties:
            up:
              type: boolean
              description: Every poller thread alive
            lastScan: { type: string, format: date-time }
            lastConsumed: { type: string, format: date-time }
            eventCount:
              type: integer
              format: int64
              description: OCSF events held in the buffer
            backpressure:
              type: boolean
              description: Buffer over its byte ceiling; new files are left untouched
            sources:
              type: array
              items:
                type: object
                required: [name, path, writable, pending, errored, failing, stalled]
                properties:
                  name: { type: string }
                  path: { type: string }
                  writable: { type: boolean }
                  pending:
                    type: integer
                    description: Candidate files not yet consumed
                  errored:
                    type: integer
                    description: The source's files rows with status error
                  failing:
                    type: boolean
                    description: The most recent scan failed (the buffer rejected the work, or the directory could not be listed)
                  stalled:
                    type: boolean
                    description: No scan completed and no file finished for 3 poll intervals (at least 120s)
                  lastScan: { type: string, format: date-time }
                  lastScanStarted: { type: string, format: date-time }
                  lastError:
                    type: string
                    description: The last scan failure
                  lastErrorAt: { type: string, format: date-time }
        db:
          type: object
          required: [walBytes, sizeBytes]
          properties:
            walBytes:
              type: integer
              format: int64
              description: Size of the WAL file
            sizeBytes:
              type: integer
              format: int64
              description: Size of the database file, free pages included
