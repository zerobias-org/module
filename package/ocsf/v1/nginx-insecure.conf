# Plain-HTTP operations config, used when HUB_NODE_INSECURE=true (local/dev,
# health-checked over HTTP). startup.sh selects this file instead of nginx.conf;
# no runtime rewriting. nginx fronts ONLY the operations port (8888 -> 127.0.0.1:8889);
# the module has no listener ports — files arrive on a mounted volume.

worker_processes 1;
daemon off;  # Run in foreground (required for Docker)
error_log /var/log/nginx/error.log warn;
# The container runs as uid 10001: the pid file and the temp paths below go where that
# user can write (the package defaults, /run and /var/lib/nginx, are root-owned).
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    access_log /var/log/nginx/access.log;

    # Uploads (uploadBinaryContent) carry whole interchange files; nginx's 1 MiB default
    # would 413 any real 835 batch. 64m matches the Java side's maxRequestSize
    # (X12ApiServer.MAX_REQUEST_BYTES) and the receiver's maxFileBytes default.
    client_max_body_size 64m;
    # A body over the in-memory buffer spools to client_body_temp_path, so an upload that
    # large fails with a 500 unless this is writable. nginx creates every temp path at
    # startup, used or not, so all five are moved.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    upstream java_app {
        server 127.0.0.1:8889;
        keepalive 32;
    }

    server {
        listen 8888 default_server;
        server_name localhost;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        location / {
            proxy_pass http://java_app;
        }
    }
}
