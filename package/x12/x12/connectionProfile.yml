type: object
description: >-
  Connection profile for the X12 receiver. Unlike demand-driven modules, there is
  no remote system to dial — X12 files arrive on a volume mounted into the
  container (daily clearinghouse / payer drops) and the daemon polls it. The
  watched source directories, poll cadence and buffer knobs are daemon-level and
  live in runtimeConfig.config (delivered as MODULE_CONFIG at container boot); the
  always-on daemon never reads this per-connection profile. It exists because the
  platform's publish pipeline requires one and to document the defaults.
properties:
  x12Version:
    type: string
    description: >-
      Informational. Files are accepted at any X12 version: each functional
      group's GS08 (e.g. 005010X221A1) selects the parser definition and schema
      for its transaction sets.
    example: "005010"
  ackDurability:
    type: string
    description: >-
      SQLite durability for the consume path. 'full' (synchronous=FULL, fsync per
      commit) closes the WAL-window gap between "committed" and "renamed .done";
      'normal' (synchronous=NORMAL) is faster. Daemon-level; the EFFECTIVE value
      comes from runtimeConfig.config.ackDurability.
    enum: [full, normal]
    default: full
