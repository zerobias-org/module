name: "@zerobias-org/module"
version: "1.0.0"

env:

  VAULT_ADDR:
    type: string
    default: "https://vault.zerobias.com"

  ZB_TOKEN:
    type: string
    mask: true

  # ── Org-first SDLC credentials (managed by setup-org-credentials.sh;
  # declared so `zbb env set` works — undeclared vars are a silent no-op).
  ZB_API_KEY:
    type: secret
    mask: true
    description: >-
      ORG key — org OWNER API key of the target org/env. Resolves the
      ${ZB_API_KEY} placeholders in .mcp.json and the zb MCP 'env'
      profile at claude session start.

  ZB_ORG_ID:
    type: string
    description: >-
      Target org UUID. Resolves the ${ZB_ORG_ID} placeholder in
      .mcp.json (zb-knowledge dana-org-id header).

  ZB_PLATFORM_URL:
    type: string
    default: "https://app.zerobias.com/api"
    description: Platform API base of the target environment

  NPM_CONFIG_TAG:
    type: string
    default: "dev"
    description: >-
      npm dist-tag for org-private rc publishes (npm 11 refuses
      prerelease publishes without one).

  KNOWLEDGE_MCP_URL:
    type: string
    default: "https://api.app.zerobias.com/knowledge-mcp/mcp"
    description: >-
      Per-env zb-knowledge MCP endpoint (keys are per-env; the .mcp.json
      default is PROD, so non-prod slots need their own value —
      setup-org-credentials.sh derives it from ZB_PLATFORM_URL).

  AWS_ACCESS_KEY_ID:
    source: vault
    vault: "aws-auth/tools/ecr/creds/ecr-push.access_key"
    refresh: true

  AWS_SECRET_ACCESS_KEY:
    source: vault
    vault: "aws-auth/tools/ecr/creds/ecr-push.secret_key"
    refresh: true
    mask: true

  ECR_REGISTRY:
    type: string
    default: "961260934100.dkr.ecr.us-east-1.amazonaws.com"
    description: ECR registry URL for Docker image publishing

  GHCR_REGISTRY:
    type: string
    default: "ghcr.io/zerobias-org"
    description: GHCR registry URL for Docker image publishing

  AWS_REGION:
    type: string
    default: "us-east-1"
    description: AWS region for ECR operations

  # Neon database — ephemeral branches for dataloader testing
  NEON_API_KEY:
    source: vault
    vault: "operations-kv/neon/content.api-key"
    mask: true

  NEON_PROJECT_ID:
    source: vault
    vault: "operations-kv/neon/content.project-id"

  NEON_PARENT_BRANCH:
    type: string
    default: "content-master"
    description: Neon parent branch to create test branches from

  NEON_DB_ROLE:
    type: string
    default: "neondb_owner"
    description: Neon database role

  NEON_DB_NAME:
    type: string
    default: "zerobias"
    description: Neon database name

# ── Lifecycle ────────────────────────────────────────────────────────
lifecycle:
  clean:       ./gradlew clean
  build:       ./gradlew build
  # dataloader is only needed for test/gate — testDataloader runs the
  # platform-dataloader binary. version/publish/build never invoke it,
  # so the per-command tools: gate is the right place to require it.
  test:
    command: ./gradlew test
    tools: [dataloader]
  gate:
    command: ./gradlew gate
    tools: [dataloader]
  gateCheck:   ./gradlew gaateCheck
  version:     ./gradlew versionStandardPackages
  publish:     ./gradlew publish
  dockerBuild: ./gradlew dockerBuild

# ── Tools registry — referenced by lifecycle.<cmd>.tools ─────────────
tools:
  dataloader:
    check: "dataloader --version 2>&1"
    parse: "Dataloader v(\\S+)"
    version: ">=1.0.87"
    install: "npm i -g @zerobias-com/platform-dataloader"
